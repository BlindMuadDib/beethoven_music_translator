apiVersion: apps/v1
kind: Deployment
metadata:
  name: mfa-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mfa-wrapper
  template:
    metadata:
      lables:
        app: mfa-wrapper
    spec:
      containers:
        -name: mfa--wrapper-container
          image: mfa-wrapper:latest
          ports:
            - containerPort: 24725
      volumeMounts:
        - name: music-volume
        mountPath: /app/music
  volumes:
    - name: music-volume
    hostPath:
      path: /containers/www/musictranslator/music
