---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server-deployment
  labels:
    app: auth-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-server
  template:
    metadata:
      labels:
        app: auth-server
    spec:
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
      - name: auth-server
        image: docker.io/blindmuaddib/auth-server:1.3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 45769
        livenessProbe:
          httpGet:
            path: /internal/healthz
            port: 45769
          initialDelaySeconds: 15   # Give the app 15s to boot up before checking
          periodSeconds: 30         # Check every 30s
          timeoutSeconds: 5         # If no response in 5s, consider it failed
          failureThreshold: 3       # Restart after 3 consecutive failures
        readinessProbe:
          httpGet:
            path: /internal/healthz
            port: 45769
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            memory: "10Gi"
            cpu: "500m"
          requests:
            memory: "1Gi"
            cpu: "100m"
        env:
          - name: FLASK_ENV
            value: "production"
          - name: SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: auth-server-secrets
                key: SECRET_KEY
          - name: SECURITY_PASSWORD_SALT
            valueFrom:
              secretKeyRef:
                name: auth-server-secrets
                key: SECRET_PASSWORD_SALT
          - name: ADMIN_INITIAL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: auth-server-secrets
                key: ADMIN_INITIAL_PASSWORD

          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: translator-admin.auth-db-cluster.credentials.postgresql.acid.zalan.do
                key: username
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: translator-admin.auth-db-cluster.credentials.postgresql.acid.zalan.do
                key: password
          - name: POSTGRES_DB
            value: "auth_db"
          - name: POSTGRES_HOST
            value: "auth-db-cluster.zalando.svc.cluster.local"

          - name: MAIL_SERVER
            value: "smtp.zoho.com"
          - name: MAIL_PORT
            value: "587"
          - name: MAIL_USE_TLS
            value: "true"
          - name: MAIL_USERNAME
            valueFrom:
              secretKeyRef:
                name: auth-server-secrets
                key: MAIL_USERNAME
          - name: MAIL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: auth-server-secrets
                key: MAIL_PASSWORD
