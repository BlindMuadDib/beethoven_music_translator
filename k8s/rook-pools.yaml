---
apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: replicapool-rwo
  namespace: rook-ceph
spec:
  failureDomain: host
  replicated:
    size: 1
    requireSafeReplicaSize: false
---
apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: musictranslatorfs
  namespace: rook-ceph
spec:
  metadataPool:
    replicated:
      size: 1
      requireSafeReplicaSize: false
  dataPools:
    - failureDomain: host
      replicated:
        size: 1
        requireSafeReplicaSize: false
      name: data0
  metadataServer:
    activeCount: 1
    activeStandby: true
