---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: musictranslator-ingress
  annotations:
    ingress.cilium.io/proxy-max-request-size: "60m"
    ingress.cilium.io/redirect-from-www: "true"
    # This annotation applies the rewrite rule to the path matched by the
    # ImplementationSpecific rule.
    # ingress.cilium.io/path-rewrite: "/auth/(.*) /\\1"
spec:
  ingressClassName: cilium
  rules:
  - host: musictranslator.org
    http:
      paths:
      #1. AUTH SERVICE RULE - Highest Priority!
      # This uses ImplementationSpecific and the global path-rewrite annotation
      # to strip the /auth prefix before forwarding to the Flask service
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 8443
      # 2. API RULES
      - path: /api/harmonic
        pathType: Prefix
        backend:
          service:
            name: harmonic-service
            port:
              number: 20006
      - path: /api/files
        pathType: Prefix
        backend:
          service:
            name: translator-service
            port:
              number: 20005
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: translator-service
            port:
              number: 20005
      # 3. ROOT/FRONTEND CATCH-ALL RULE - Lowest Priority
      - path: /
        pathType: Prefix
        backend:
          service:
            name: beethoven-service
            port:
              number: 8443
  tls:
  - hosts:
      - musictranslator.org
      - www.musictranslator.org
    secretName: tls-cert
