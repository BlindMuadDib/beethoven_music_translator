---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drums-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drums-client
  template:
    metadata:
      labels:
        app: drums-client
    spec:
      containers:
        - name: drums-client-container
          image: docker.io/blindmuaddib/drums-endpoint:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 25941
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
          volumeMounts:
            - name: shared-data
              mountPath: /shared-data/separator_output
              subPath: separator_output
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: shared-data-pvc


