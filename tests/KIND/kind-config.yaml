---
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 80
    hostPort: 9000
    protocol: TCP
  - containerPort: 443
    hostPort: 9443
    protocol: TCP
  extraMounts:
  - hostPath: /opt/MTD/shared-data
    containerPath: /opt/MTD/shared-data
networking:
  # ISOLATION: These ranges must NOT overlap with Host's Cilium ranges
  serviceSubnet: "10.128.0.0/12"
  podSubnet: "10.240.0.0/16"
